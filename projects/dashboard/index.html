<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Демо вебзастосунку: вхід, особистий кабінет, таблиця замовлень із пошуком, сортуванням і зміною статусів, графік та експорт у CSV.">
  <title>Orderly — кабінет менеджера (демо)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-demo-bar">
  <!-- Екран входу -->
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" novalidate>
      <p class="logo">Orderly<span>.</span></p>
      <h1>Вхід у кабінет</h1>
      <p class="hint">Демо-доступ уже підставлено: <b>demo@portfolio.dev</b> / <b>demo1234</b></p>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" value="demo@portfolio.dev" required></div>
      <div class="field"><label for="pass">Пароль</label><input id="pass" type="password" autocomplete="current-password" value="demo1234" required></div>
      <p id="login-err" class="err" role="alert"></p>
      <button class="btn btn-lime wide" type="submit">Увійти</button>
    </form>
  </section>

  <!-- Застосунок -->
  <div id="app" class="app" hidden>
    <header class="bar">
      <p class="logo">Orderly<span>.</span></p>
      <div class="bar-right"><span id="who" class="who"></span><button id="logout" class="btn btn-line-light" type="button">Вийти</button></div>
    </header>
    <main class="wrap main">
      <h1>Огляд замовлень</h1>
      <section class="kpis" id="kpis" aria-label="Ключові показники"></section>

      <section class="panel">
        <h2>Виручка за 7 днів</h2>
        <div id="chart" class="chart" role="img" aria-label="Стовпчаста діаграма виручки за останні 7 днів"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Замовлення</h2>
          <div class="controls">
            <label class="sr-only" for="search">Пошук</label><input id="search" type="search" placeholder="Пошук: клієнт, товар або №…" autocomplete="off">
            <label class="sr-only" for="status">Статус</label>
            <select id="status"><option value="">Усі статуси</option><option>Нове</option><option>В обробці</option><option>Відправлено</option><option>Скасовано</option></select>
            <button id="export" class="btn btn-dark" type="button">Експорт CSV</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th scope="col"><button data-sort="id">№</button></th>
              <th scope="col"><button data-sort="customer">Клієнт</button></th>
              <th scope="col"><button data-sort="product">Товар</button></th>
              <th scope="col"><button data-sort="date">Дата</button></th>
              <th scope="col" class="num"><button data-sort="amount">Сума</button></th>
              <th scope="col">Статус</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p id="no-rows" class="empty" hidden>За цими умовами замовлень немає.</p>
        <div class="pager"><button id="prev" class="btn btn-line" type="button">← Назад</button><span id="page-info" aria-live="polite"></span><button id="next" class="btn btn-line" type="button">Далі →</button></div>
      </section>
    </main>
  </div>

  <div class="demo-bar"><a href="../../index.html#work">← Назад до портфоліо</a></div>
  <script src="main.js"></script>
</body>
</html>
