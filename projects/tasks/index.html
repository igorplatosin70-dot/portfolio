<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="Менеджер завдань: додавання, редагування, видалення, фільтри, пріоритети, терміни, збереження в браузері та обробка помилок.">
  <title>Tasks — менеджер завдань (демо)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-demo-bar">
  <main class="wrap shell">
    <header class="head">
      <p class="eyebrow">Менеджер завдань</p>
      <h1>Що робимо <em>сьогодні?</em></h1>
      <p id="progress-text" class="progress-text" aria-live="polite"></p>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
    </header>

    <form id="add" class="add" novalidate>
      <div class="add-main">
        <label class="sr-only" for="title">Нове завдання</label>
        <input id="title" name="title" placeholder="Нове завдання…" maxlength="120" autocomplete="off">
        <button class="btn btn-dark" type="submit">Додати</button>
      </div>
      <div class="add-extra">
        <label>Пріоритет
          <select id="priority" name="priority"><option value="low">Низький</option><option value="mid" selected>Середній</option><option value="high">Високий</option></select>
        </label>
        <label>Термін <input id="due" name="due" type="date"></label>
      </div>
      <p id="form-error" class="form-error" role="alert"></p>
    </form>

    <div class="filters">
      <div id="filter" class="seg" role="group" aria-label="Фільтр">
        <button type="button" data-f="all" aria-pressed="true">Усі</button>
        <button type="button" data-f="active" aria-pressed="false">Активні</button>
        <button type="button" data-f="done" aria-pressed="false">Виконані</button>
      </div>
      <label class="sr-only" for="find">Пошук</label>
      <input id="find" class="find" type="search" placeholder="Пошук…" autocomplete="off">
    </div>

    <p id="storage-warn" class="warn" role="status" hidden>Браузер не дозволяє зберігати дані — завдання зникнуть після перезавантаження.</p>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>
    <div class="foot"><span id="left"></span><button id="clear" class="link" type="button">Видалити виконані</button></div>
    <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="undo" type="button">Скасувати</button></div>
  </main>

  <div class="demo-bar"><a href="../../index.html#work">← Назад до портфоліо</a></div>
  <script src="main.js"></script>
</body>
</html>
